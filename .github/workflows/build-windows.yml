name: Build Windows portable exe

on:
  workflow_dispatch:
  push:
    branches: [ main, portable-launcher ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug: list repository files
        run: |
          echo "Working directory:"
          pwd
          echo "List root:"
          Get-ChildItem -Recurse -Force | Select-Object -First 200

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: |
          npm ci

      - name: Build workspaces (frontend + backend)
        run: |
          npm run build --if-present

      - name: Prepare built artifacts for Electron
        run: |
          New-Item -ItemType Directory -Force -Path built_artifacts | Out-Null
          if (Test-Path "apps/web/dist") {
            Copy-Item -Recurse -Force "apps/web/dist" "built_artifacts/web"
          }
          if (Test-Path "apps/server/dist") {
            Copy-Item -Recurse -Force "apps/server/dist" "built_artifacts/server"
          }

      - name: Copy portable electron folder
        run: |
          Copy-Item -Recurse -Force "reports-system-portable" "built_portable"

      - name: Copy built artifacts into portable
        run: |
          Copy-Item -Recurse -Force "built_artifacts" "built_portable/built_artifacts"

      - name: Install portable deps
        working-directory: ./built_portable
        run: |
          npm install

      - name: Build portable exe (electron-builder)
        working-directory: ./built_portable
        run: |
          npx electron-builder --win portable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-system-windows-portable
          path: ./built_portable/dist
